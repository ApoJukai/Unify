<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanTask Pro | 2026 Enterprise</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366F1; --primary-dark: #4338CA; --accent: #10B981;
            --bg-main: #F8FAFC; --bg-sidebar: #1E293B; --text-main: #1E293B;
            --text-muted: #64748B; --border: #E2E8F0; --white: #FFFFFF;
            --p-high: #EF4444; --p-med: #F59E0B; --p-low: #94A3B8;
            --today: #FF4D4D; --danger: #F43F5E;
            --status-bg-backlog: #F1F5F9; --status-txt-backlog: #475569;
            --status-bg-progress: #EEF2FF; --status-txt-progress: #6366F1;
            --status-bg-done: #D1FAE5; --status-txt-done: #059669;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Lato', sans-serif; }
        h1, h2, h3, h4, .logo-flex, .create-btn, .nav-item, th, .t-header { font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar & Layout */
        aside { width: 260px; background: var(--bg-sidebar); padding: 25px; display: flex; flex-direction: column; color: var(--white); flex-shrink: 0; }
        .logo-flex { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font-size: 22px; font-weight: 800; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; color: #94A3B8; transition: 0.3s; font-size: 14px; font-weight: 700; }
        .nav-item.active { background: var(--primary); color: var(--white); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .create-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 30px; width: 100%; font-weight: 800; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 20px 40px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .view-section { display: none; padding: 30px 40px; overflow-y: auto; flex: 1; }

        /* Timeline Fixes */
        .timeline-wrapper { display: flex; border: 1px solid var(--border); border-radius: 16px; height: 500px; background: white; overflow: hidden; }
        .t-sidebar { width: 220px; border-right: 1px solid var(--border); background: #F8FAFC; flex-shrink: 0; }
        .t-grid { flex: 1; overflow-x: auto; position: relative; }
        .t-header { height: 50px; border-bottom: 1px solid var(--border); background: #F8FAFC; display: flex; align-items: center; font-size: 10px; font-weight: 800; color: var(--text-muted); }
        .t-row { height: 50px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; padding: 0 15px; font-size: 13px; font-weight: 700; }
        .t-bar { position: absolute; height: 32px; top: 9px; border-radius: 8px; color: white; font-size: 10px; font-weight: 800; display: flex; align-items: center; padding: 0 12px; cursor: pointer; white-space: nowrap; z-index: 2; }
        .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); z-index: 5; pointer-events: none; }

        /* Modals & Tables */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-card { background: white; width: 1000px; border-radius: 28px; display: grid; grid-template-columns: 1fr 380px; height: 85vh; overflow: hidden; }
        .list-table { width: 100%; border-collapse: collapse; }
        .list-table th { background: #F8FAFC; text-align: left; padding: 18px 20px; font-size: 11px; font-weight: 800; color: var(--text-muted); border-bottom: 1px solid var(--border); text-transform: uppercase; }
        .list-row td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .priority-badge { font-family: 'Montserrat'; font-size: 10px; padding: 5px 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
        .p-high { background: #FEE2E2; color: #B91C1C; }
        .p-medium { background: #FEF3C7; color: #B45309; }
        .p-low { background: #F1F5F9; color: #475569; }
        
        .status-badge { font-size: 10px; padding: 5px 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
        .stat-not-started { background: var(--status-bg-backlog); color: var(--status-txt-backlog); }
        .stat-in-progress { background: var(--status-bg-progress); color: var(--status-txt-progress); }
        .stat-finished { background: var(--status-bg-done); color: var(--status-txt-done); }

        .btn-icon { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); transition: 0.2s; }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

        /* Board Cards */
        .task-card { background: white; padding: 16px; border-radius: 16px; margin-bottom: 12px; cursor: grab; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .sms-bubble { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; max-width: 90%; }
        .sms-user { background: var(--primary); color: white; align-self: flex-end; }
        .sms-system { background: #E2E8F0; color: var(--text-main); align-self: flex-start; }
        #chatContainer { display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <aside>
        <div class="logo-flex"><i data-lucide="shield-check" fill="var(--accent)" color="var(--accent)"></i><span>PlanTask</span></div>
        <button class="create-btn" onclick="openModal()">+ NEW PROJECT TASK</button>
        <nav>
            <div class="nav-item active" onclick="switchView('board', this)"><i data-lucide="layout-grid"></i> Board</div>
            <div class="nav-item" onclick="switchView('list', this)"><i data-lucide="layers"></i> Task List</div>
            <div class="nav-item" onclick="switchView('timeline', this)"><i data-lucide="calendar-range"></i> Timeline</div>
            <div class="nav-item" onclick="switchView('analytics', this)"><i data-lucide="line-chart"></i> Analytics</div>
            <div class="nav-item" onclick="switchView('archive', this)"><i data-lucide="box"></i> Harvested</div>
        </nav>
    </aside>

    <main>
        <header>
            <h2 id="view-title">Project Board</h2>
            <div style="position:relative"><input type="text" id="globalSearch" placeholder="Search tasks..." oninput="renderAll()" style="padding:12px 40px; border-radius:12px; border:1px solid var(--border); background:#F1F5F9; outline:none; width:300px;"></div>
        </header>

        <div id="view-board" class="view-section" style="display: block;">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
                <div ondrop="drop(event, 'Not Started')" ondragover="allow(event)" style="background:#EDF2F7; padding:20px; border-radius:24px; min-height:60vh;"><h4 style="font-size:11px; color:var(--text-muted); margin-bottom:15px; letter-spacing:1px;">BACKLOG</h4><div id="board-notstarted"></div></div>
                <div ondrop="drop(event, 'In-Progress')" ondragover="allow(event)" style="background:#EDF2F7; padding:20px; border-radius:24px;"><h4 style="font-size:11px; color:var(--primary); margin-bottom:15px; letter-spacing:1px;">ACTIVE</h4><div id="board-inprogress"></div></div>
                <div ondrop="drop(event, 'Finished')" ondragover="allow(event)" style="background:#EDF2F7; padding:20px; border-radius:24px;"><h4 style="font-size:11px; color:var(--accent); margin-bottom:15px; letter-spacing:1px;">DONE</h4><div id="board-finished"></div></div>
            </div>
        </div>

        <div id="view-list" class="view-section">
            <div style="margin-bottom:20px; display:flex; gap:10px; align-items:center;">
                <span style="font-size:11px; font-weight:800; color:var(--text-muted)">SORT TASKS:</span>
                <select id="sortBy" onchange="renderAll()" style="padding:8px; border-radius:8px; font-weight:700;"><option value="manual">Manual Reorder</option><option value="priority">Priority</option><option value="name">Name</option></select>
            </div>
            <div style="background:white; border-radius:16px; border:1px solid var(--border); overflow:hidden;">
                <table class="list-table"><thead><tr><th style="width:40px"></th><th>Task & Description</th><th>Owner</th><th>Priority</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody id="list-tbody"></tbody></table>
            </div>
        </div>

        <div id="view-timeline" class="view-section">
            <div class="timeline-wrapper">
                <div class="t-sidebar"><div class="t-header" style="padding-left:15px;">RESOURCE ALLOCATION</div><div id="t-side-rows"></div></div>
                <div class="t-grid"><div id="t-headers" class="t-header" style="width:max-content;"></div><div id="t-bars-rows" style="position:relative; width:max-content;"></div></div>
            </div>
        </div>

        <div id="view-analytics" class="view-section">
            <div id="stat-cards" style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:30px;"></div>
            <div class="grid-insights">
                <div class="chart-container"><canvas id="c-velocity"></canvas></div>
                <div class="chart-container"><canvas id="c-status"></canvas></div>
                <div class="chart-container"><canvas id="c-workload"></canvas></div>
                <div class="chart-container"><canvas id="c-priority"></canvas></div>
            </div>
        </div>

        <div id="view-archive" class="view-section">
            <div style="background:white; border-radius:16px; border:1px solid var(--border); overflow:hidden;">
                <table class="list-table"><thead><tr><th>Task Name</th><th>Owner</th><th>Harvested Date</th><th style="text-align:right">Action</th></tr></thead><tbody id="archive-tbody"></tbody></table>
            </div>
        </div>
    </main>

    <div class="modal" id="taskModal">
        <div class="modal-card">
            <div style="padding:40px; overflow-y:auto">
                <h3 style="margin-bottom:30px; font-weight:800; color:var(--primary); font-size:22px;">Task Editor</h3>
                <form id="taskForm">
                    <input type="hidden" id="editId">
                    <label style="font-size:11px; font-weight:800; color:var(--text-muted)">TASK IDENTIFIER</label>
                    <input type="text" id="mName" style="width:100%; margin-bottom:15px; padding:10px; border:1px solid var(--border); border-radius:8px;" required>
                    <label style="font-size:11px; font-weight:800; color:var(--text-muted)">DESCRIPTION</label>
                    <textarea id="mDesc" rows="3" style="width:100%; margin-bottom:15px; padding:10px; border:1px solid var(--border); border-radius:8px;"></textarea>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        <div><label style="font-size:11px; font-weight:800;">START</label><input type="date" id="mStart" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;"></div>
                        <div><label style="font-size:11px; font-weight:800;">DUE</label><input type="date" id="mEnd" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;"></div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
                        <div><label style="font-size:11px; font-weight:800;">ASSIGNEE</label><input type="text" id="mOwner" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;"></div>
                        <div><label style="font-size:11px; font-weight:800;">PRIORITY</label><select id="mImp" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
                    </div>
                    <label style="font-size:11px; font-weight:800; color:var(--text-muted); display:block; margin-top:15px;">CURRENT STATUS</label>
                    <select id="mStat" style="width:100%; margin:5px 0 20px 0; padding:10px; background:#F1F5F9; border:none; font-weight:800; color:var(--primary);"><option>Not Started</option><option>In-Progress</option><option>Finished</option></select>
                    <div style="display:flex; gap:10px;">
                        <button type="button" onclick="closeModal()" style="flex:1; padding:15px; border-radius:12px; border:none; background:#F1F5F9; font-weight:800; cursor:pointer;">CANCEL</button>
                        <button type="submit" class="create-btn" style="flex:2; margin:0;">SAVE CHANGES</button>
                    </div>
                </form>
            </div>
            <div style="background:#F8FAFC; padding:25px; border-left:1px solid var(--border); display:flex; flex-direction:column;">
                <h4 style="font-size:11px; font-weight:800; color:var(--text-muted); margin-bottom:15px;">SYSTEM LOG & NOTES</h4>
                <div id="chatContainer" style="flex:1; overflow-y:auto;"></div>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <input type="text" id="chatInput" placeholder="Add note..." onkeypress="if(event.key==='Enter') addNote()" style="flex:1; padding:10px; border:1px solid var(--border); border-radius:8px;">
                    <button onclick="addNote()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:8px; font-weight:800; cursor:pointer;">POST</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA1lEjH3Fh747RdRQ-2emPnv_aJqb2Zywo",
  authDomain: "plantask-collaborative.firebaseapp.com",
  projectId: "plantask-collaborative",
  storageBucket: "plantask-collaborative.firebasestorage.app",
  messagingSenderId: "75156468250",
  appId: "1:75156468250:web:d5a61c2c78f9195be117a3",
  measurementId: "G-D4FMXZLX7N" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let tasks = []; let activeCharts = {}; let dragSrc = null;

        db.ref('tasks').on('value', snap => {
            tasks = snap.val() ? Object.values(snap.val()) : [];
            renderAll();
        });

        function saveTask(obj) { db.ref('tasks/' + obj.id).set(obj).then(() => renderAll()); }
        function hardDelete(id) { if(confirm("Permanently delete?")) db.ref('tasks/' + id).remove(); }
        function closeModal() { document.getElementById('taskModal').style.display = 'none'; }
        function getStatusClass(status) { if(status === 'Finished') return 'stat-finished'; if(status === 'In-Progress') return 'stat-in-progress'; return 'stat-not-started'; }

        function renderAll() {
            const q = document.getElementById('globalSearch').value.toLowerCase();
            const sort = document.getElementById('sortBy').value;
            let filtered = tasks.filter(t => !t.archived && (t.name.toLowerCase().includes(q)));
            if(sort === 'priority') { const map = {High:1, Medium:2, Low:3}; filtered.sort((a,b) => map[a.importance] - map[b.importance]); } 
            else if(sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));

            const cols = {'Not Started':'board-notstarted','In-Progress':'board-inprogress','Finished':'board-finished'};
            Object.values(cols).forEach(c => document.getElementById(c).innerHTML = '');
            filtered.forEach(t => {
                const color = t.importance === 'High' ? 'var(--p-high)' : t.importance === 'Medium' ? 'var(--p-med)' : 'var(--p-low)';
                document.getElementById(cols[t.status]).innerHTML += `<div class="task-card" onclick="openModal(${t.id})" draggable="true" ondragstart="drag(event, ${t.id})" style="border-top:4px solid ${color};"><div style="font-weight:800; font-size:14px; margin-bottom:6px;">${t.name}</div><div style="font-size:11px; color:var(--text-muted); font-weight:700;">${(t.owner||'NO OWNER').toUpperCase()}</div></div>`;
            });

            document.getElementById('list-tbody').innerHTML = filtered.map(t => `<tr class="list-row" draggable="true" ondragstart="hDrag(event, ${t.id})" ondrop="hDrop(event, ${t.id})" ondragover="event.preventDefault()"><td><i data-lucide="grip-vertical" size="14"></i></td><td><div style="font-weight:800;">${t.name}</div><div style="font-size:11px; color:var(--text-muted);">${t.desc||''}</div></td><td style="font-size:12px; font-weight:800;">${(t.owner||'-').toUpperCase()}</td><td><span class="priority-badge p-${t.importance.toLowerCase()}">${t.importance}</span></td><td><span class="status-badge ${getStatusClass(t.status)}">${t.status}</span></td><td style="text-align:right"><button class="btn-icon" onclick="openModal(${t.id})"><i data-lucide="edit-3" size="14"></i></button><button class="btn-icon" onclick="toggleArchive(${t.id}, true)"><i data-lucide="package" size="14"></i></button></td></tr>`).join('');
            document.getElementById('archive-tbody').innerHTML = tasks.filter(t => t.archived).map(t => `<tr class="list-row"><td><b>${t.name}</b></td><td>${t.owner}</td><td>${t.closedOn}</td><td style="text-align:right"><button class="btn-icon" onclick="toggleArchive(${t.id}, false)"><i data-lucide="rotate-ccw" size="14"></i></button><button class="btn-icon" style="color:red" onclick="hardDelete(${t.id})"><i data-lucide="trash-2" size="14"></i></button></td></tr>`).join('');

            renderTimeline(); renderStats(); lucide.createIcons();
        }

        function renderTimeline() {
            const side = document.getElementById('t-side-rows'), bars = document.getElementById('t-bars-rows'), heads = document.getElementById('t-headers');
            side.innerHTML = ''; bars.innerHTML = ''; heads.innerHTML = '';
            const startBase = new Date(); startBase.setDate(startBase.getDate()-5); startBase.setHours(0,0,0,0);
            const dayW = 80; const today = new Date(); today.setHours(0,0,0,0);
            for(let i=0; i<30; i++) {
                let d = new Date(startBase); d.setDate(d.getDate()+i); const isToday = d.getTime() === today.getTime();
                heads.innerHTML += `<div style="width:${dayW}px; text-align:center; height:50px; display:flex; flex-direction:column; justify-content:center; border-right:1px solid #F1F5F9; ${isToday?'color:var(--today);font-weight:900':''}"><span>${d.getDate()}</span><span style="font-size:8px;">${d.toLocaleDateString([],{month:'short'})}</span></div>`;
                if(isToday) { const line = document.createElement('div'); line.className = 'today-line'; line.style.left = (i * dayW + dayW/2) + 'px'; bars.appendChild(line); }
            }
            tasks.filter(t => !t.archived && t.start && t.end).forEach(t => {
                side.innerHTML += `<div class="t-row">${t.name}</div>`;
                const sDate = new Date(t.start + "T00:00:00"), eDate = new Date(t.end + "T23:59:59");
                const offset = Math.floor((sDate - startBase) / 864e5), dur = Math.ceil((eDate - sDate) / 864e5);
                const row = document.createElement('div'); row.style.height = '50px'; row.style.borderBottom = '1px solid #F1F5F9'; row.style.width = (30 * dayW) + 'px';
                const bar = document.createElement('div'); bar.className = 't-bar'; bar.style.left = (offset * dayW) + 'px'; bar.style.width = (dur * dayW) + 'px';
                bar.style.background = t.status === 'Finished' ? 'var(--accent)' : t.status === 'In-Progress' ? 'var(--primary)' : '#94A3B8';
                bar.innerText = t.name; bar.onclick = () => openModal(t.id); row.appendChild(bar); bars.appendChild(row);
            });
        }

        function renderStats() {
            const done = tasks.filter(t=>t.status==='Finished').length;
            document.getElementById('stat-cards').innerHTML = `<div class="stat-box"><h4>Productivity</h4><div style="font-size:24px; font-weight:800; color:var(--accent)">${Math.round(done/(tasks.length||1)*100)}%</div></div><div class="stat-box"><h4>Active</h4><div style="font-size:24px; font-weight:800; color:var(--primary)">${tasks.filter(t=>t.status==='In-Progress').length}</div></div><div class="stat-box"><h4>Backlog</h4><div style="font-size:24px; font-weight:800; color:var(--text-muted)">${tasks.filter(t=>t.status==='Not Started').length}</div></div><div class="stat-box"><h4>High Risk</h4><div style="font-size:24px; font-weight:800; color:var(--p-high)">${tasks.filter(t=>t.importance==='High').length}</div></div>`;
            const init = (id, type, labels, data, colors) => { if(activeCharts[id]) activeCharts[id].destroy(); activeCharts[id] = new Chart(document.getElementById(id), { type, data: { labels, datasets: [{ data, backgroundColor: colors, fill: false }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: id.replace('c-', '').toUpperCase() } } } }); };
            init('c-velocity', 'line', ['W1','W2','W3','W4'], [2,5,3,done], '#6366F1');
            init('c-status', 'doughnut', ['Done','Active','Backlog'], [done, tasks.filter(t=>t.status==='In-Progress').length, tasks.filter(t=>t.status==='Not Started').length], ['#10B981','#6366F1','#CBD5E1']);
            const owners = {}; tasks.forEach(t => { const o = t.owner || 'Unassigned'; owners[o] = (owners[o]||0)+1; });
            init('c-workload', 'radar', Object.keys(owners), Object.values(owners), 'rgba(99, 102, 241, 0.2)');
            const p = {High:0, Medium:0, Low:0}; tasks.forEach(t => p[t.importance]++); init('c-priority', 'polarArea', ['High','Med','Low'], [p.High, p.Medium, p.Low], ['#EF4444','#F59E0B','#94A3B8']);
        }

        function openModal(id = null) {
            const t = tasks.find(x => x.id == id) || { id: Date.now(), name: '', status: 'Not Started', importance: 'Medium', logs: [] };
            document.getElementById('editId').value = t.id;
            document.getElementById('mName').value = t.name || '';
            document.getElementById('mDesc').value = t.desc || '';
            document.getElementById('mStart').value = t.start || '';
            document.getElementById('mEnd').value = t.end || '';
            document.getElementById('mOwner').value = t.owner || '';
            document.getElementById('mImp').value = t.importance;
            document.getElementById('mStat').value = t.status;
            document.getElementById('chatContainer').innerHTML = (t.logs||[]).map(l => `<div class="sms-bubble ${l.type==='user'?'sms-user':'sms-system'}">${l.msg}</div>`).join('');
            document.getElementById('taskModal').style.display = 'flex';
        }

        document.getElementById('taskForm').onsubmit = e => {
            e.preventDefault();
            const id = parseInt(document.getElementById('editId').value);
            let t = tasks.find(x => x.id === id);
            if(!t) { t = { id: id, logs: [{type:'system',msg:'Created'}] }; tasks.push(t); }
            t.name = document.getElementById('mName').value;
            t.desc = document.getElementById('mDesc').value;
            t.start = document.getElementById('mStart').value;
            t.end = document.getElementById('mEnd').value;
            t.owner = document.getElementById('mOwner').value;
            t.importance = document.getElementById('mImp').value;
            t.status = document.getElementById('mStat').value;
            t.archived = false;
            saveTask(t); closeModal();
        };

        function addNote() {
            const id = parseInt(document.getElementById('editId').value), input = document.getElementById('chatInput');
            if(!id || !input.value.trim()) return;
            const t = tasks.find(x => x.id === id); if(!t) return;
            if(!t.logs) t.logs = []; t.logs.push({ type:'user', msg:input.value });
            input.value = ''; saveTask(t);
            document.getElementById('chatContainer').innerHTML = t.logs.map(l => `<div class="sms-bubble ${l.type==='user'?'sms-user':'sms-system'}">${l.msg}</div>`).join('');
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        function toggleArchive(id, s) { const t = tasks.find(x => x.id == id); if(t){ t.archived = s; t.closedOn = s ? new Date().toLocaleDateString() : null; saveTask(t); } }
        function switchView(v, el) { document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.view-section').forEach(s=>s.style.display='none'); document.getElementById('view-'+v).style.display='block'; }
        function drag(e, id) { e.dataTransfer.setData("text", id); }
        function drop(e, stat) { const id = e.dataTransfer.getData("text"), t = tasks.find(x => x.id == id); if(t){ t.status = stat; saveTask(t); } }
        function allow(e) { e.preventDefault(); }
        function hDrag(e, id) { dragSrc = id; }
        function hDrop(e, targetId) { e.preventDefault(); const from = tasks.findIndex(t => t.id === dragSrc), to = tasks.findIndex(t => t.id === targetId); const temp = tasks[from]; tasks.splice(from, 1); tasks.splice(to, 0, temp); db.ref('tasks').set(tasks.reduce((a,v)=>({ ...a, [v.id]:v }), {})); }
    </script>
</body>
</html>
